server {
    listen 80;
    server_name 187.77.141.145;  # แก้เป็น domain ถ้ามี

    client_max_body_size 20M;

    # Static files (whitenoise handles, but nginx is faster)
    location /static/ {
        alias /var/www/construction_erp/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/construction_erp/media/;
    }

    location / {
        proxy_pass http://unix:/run/construction_erp.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
