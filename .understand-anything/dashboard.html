<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HERMES ERP — Knowledge Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{--bg:#0f1116;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--txt:#e6e8ec;--mut:#9aa3b2;--accent:#6ea8fe}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:flex;height:100vh}
#side{width:320px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#side h1{font-size:15px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600}
#side h1 small{display:block;color:var(--mut);font-weight:400;font-size:11px;margin-top:3px}
.sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.sec h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 8px}
#search{width:100%;padding:7px 9px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--txt);font-size:13px}
.legend{display:flex;flex-direction:column;gap:5px;max-height:230px;overflow:auto}
.lg{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;padding:3px 4px;border-radius:5px}
.lg:hover{background:var(--panel2)}.lg.off{opacity:.35}
.dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.lg .n{margin-left:auto;color:var(--mut);font-size:11px}
#detail{flex:1;overflow:auto;padding:14px 16px}
#detail .ph{color:var(--mut);font-size:13px;line-height:1.6}
.dtitle{font-size:14px;font-weight:600;word-break:break-word}
.dtype{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:4px 0}
.dpath{font-family:ui-monospace,monospace;font-size:11px;color:var(--mut);word-break:break-all;margin:2px 0 10px}
.dsum{font-size:13px;line-height:1.6;color:var(--txt)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tag{font-size:10px;background:var(--panel2);border:1px solid var(--line);padding:2px 7px;border-radius:10px;color:var(--mut)}
.rel{margin-top:14px}.rel h3{font-size:11px;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
.rel a{display:block;font-size:12px;color:var(--accent);cursor:pointer;padding:2px 0;text-decoration:none}
.rel .et{color:var(--mut);font-size:10px}
#main{flex:1;position:relative}
svg{width:100%;height:100%;display:block}
.node circle{cursor:pointer;stroke:#0b0d12;stroke-width:1.2px}
.node text{font-size:9px;fill:var(--mut);pointer-events:none}
.link{stroke:#3a4150;stroke-opacity:.5}
#tourbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px;max-width:640px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#tourbar .tt{font-size:12px}.tt b{font-size:13px}.tt p{margin:3px 0 0;color:var(--mut);line-height:1.5}
#tourbar button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px 11px;cursor:pointer;font-size:12px}
#tourbar button:hover{border-color:var(--accent)}
.hl circle{stroke:var(--accent);stroke-width:2.5px}
#toggleTour{position:absolute;right:16px;top:16px;z-index:5}
.stat{display:flex;gap:14px;font-size:11px;color:var(--mut);padding:8px 16px;border-bottom:1px solid var(--line)}
.stat b{color:var(--txt)}
</style></head><body>
<div id="app">
 <div id="side">
   <h1>HERMES Construction ERP<small id="sub"></small></h1>
   <div class="stat" id="stat"></div>
   <div class="sec"><h2>Search</h2><input id="search" placeholder="Filter nodes by name…"></div>
   <div class="sec"><h2>Layers</h2><div class="legend" id="legend"></div></div>
   <div id="detail"><div class="ph">Click any node to see its summary, tags and connections. Use the tour (top-right) for a guided walkthrough.</div></div>
 </div>
 <div id="main">
   <button id="toggleTour">▶ Guided tour</button>
   <svg id="svg"></svg>
   <div id="tourbar" style="display:none"></div>
 </div>
</div>

const layerOf={};G.layers.forEach(l=>l.nodeIds.forEach(id=>layerOf[id]=l.id));
const palette=['#6ea8fe','#63e6be','#ffd43b','#ff8787','#b197fc','#ffa94d','#74c0fc','#f783ac','#8ce99a','#ffc078'];
const layerColor={};G.layers.forEach((l,i)=>layerColor[l.id]=palette[i%palette.length]);
function colorFor(n){return layerColor[layerOf[n.id]]|| '#7a8394';}
document.getElementById('sub').textContent=G.project.description.slice(0,120);
const typeC={};G.nodes.forEach(n=>typeC[n.type]=(typeC[n.type]||0)+1);
document.getElementById('stat').innerHTML=`<span><b>${G.nodes.length}</b> nodes</span><span><b>${G.edges.length}</b> edges</span><span><b>${G.layers.length}</b> layers</span>`;
const off=new Set();
const legend=document.getElementById('legend');
G.layers.forEach(l=>{const cnt=l.nodeIds.length;const d=document.createElement('div');d.className='lg';d.innerHTML=`<span class="dot" style="background:${layerColor[l.id]}"></span><span>${l.name}</span><span class="n">${cnt}</span>`;d.onclick=()=>{if(off.has(l.id))off.delete(l.id);else off.add(l.id);d.classList.toggle('off');render();};legend.appendChild(d);});
const svg=d3.select('#svg');let W=0,H=0;
const gLink=svg.append('g'),gNode=svg.append('g');
const nodeById={};G.nodes.forEach(n=>nodeById[n.id]=n);
const links=G.edges.map(e=>({source:e.source,target:e.target,type:e.type})).filter(e=>nodeById[e.source]&&nodeById[e.target]);
const radius=n=>n.type==='file'?6:(n.type==='config'?6:(n.type==='class'?4:3));
const sim=d3.forceSimulation(G.nodes)
 .force('link',d3.forceLink(links).id(d=>d.id).distance(d=>d.type==='contains'?22:60).strength(.5))
 .force('charge',d3.forceManyBody().strength(-60))
 .force('center',d3.forceCenter())
 .force('collide',d3.forceCollide().radius(d=>radius(d)+3));
let linkSel,nodeSel;
function render(){
 const vis=new Set(G.nodes.filter(n=>!off.has(layerOf[n.id])).map(n=>n.id));
 const L=links.filter(l=>vis.has(l.source.id||l.source)&&vis.has(l.target.id||l.target));
 linkSel=gLink.selectAll('line').data(L,d=>(d.source.id||d.source)+'-'+(d.target.id||d.target)+d.type);
 linkSel.exit().remove();linkSel=linkSel.enter().append('line').attr('class','link').merge(linkSel);
 nodeSel=gNode.selectAll('g.node').data(G.nodes.filter(n=>vis.has(n.id)),d=>d.id);
 nodeSel.exit().remove();
 const en=nodeSel.enter().append('g').attr('class','node').call(drag(sim)).on('click',(e,d)=>select(d));
 en.append('circle').attr('r',radius).attr('fill',colorFor);
 en.append('title').text(d=>d.name);
 en.filter(d=>d.type==='file'||d.type==='config').append('text').attr('x',8).attr('y',3).text(d=>d.name);
 nodeSel=en.merge(nodeSel);
 sim.nodes(G.nodes);sim.force('link').links(links);sim.alpha(.5).restart();
}
sim.on('tick',()=>{if(linkSel)linkSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);if(nodeSel)nodeSel.attr('transform',d=>`translate(${d.x},${d.y})`);});
function drag(s){return d3.drag().on('start',(e,d)=>{if(!e.active)s.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;}).on('end',(e,d)=>{if(!e.active)s.alphaTarget(0);d.fx=null;d.fy=null;});}
const zoom=d3.zoom().scaleExtent([.2,5]).on('zoom',e=>{gLink.attr('transform',e.transform);gNode.attr('transform',e.transform);});
svg.call(zoom);
function resize(){W=document.getElementById('main').clientWidth;H=document.getElementById('main').clientHeight;svg.attr('viewBox',[-W/2,-H/2,W,H]);}
window.addEventListener('resize',resize);resize();render();
function select(d){
 gNode.selectAll('g.node').classed('hl',n=>n.id===d.id);
 const ins=G.edges.filter(e=>e.target===d.id),outs=G.edges.filter(e=>e.source===d.id);
 const layerName=(G.layers.find(l=>l.id===layerOf[d.id])||{}).name||'—';
 const rel=(arr,dir)=>arr.slice(0,40).map(e=>{const oid=dir==='out'?e.target:e.source;const o=nodeById[oid];if(!o)return'';return `<a data-id="${oid}"><span class="et">${e.type} ${dir==='out'?'→':'←'}</span> ${o.name}</a>`;}).join('');
 document.getElementById('detail').innerHTML=
  `<div class="dtitle">${d.name}</div><div class="dtype">${d.type} · ${layerName}</div>`+
  (d.filePath?`<div class="dpath">${d.filePath}</div>`:'')+
  `<div class="dsum">${d.summary||''}</div>`+
  `<div class="tags">${(d.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>`+
  (outs.length?`<div class="rel"><h3>Outgoing (${outs.length})</h3>${rel(outs,'out')}</div>`:'')+
  (ins.length?`<div class="rel"><h3>Incoming (${ins.length})</h3>${rel(ins,'in')}</div>`:'');
 document.querySelectorAll('#detail a[data-id]').forEach(a=>a.onclick=()=>{const n=nodeById[a.dataset.id];if(n)select(n);});
}
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();gNode.selectAll('g.node circle').attr('opacity',d=>!q||d.name.toLowerCase().includes(q)?1:.12);});
// Tour
let ti=-1;const tb=document.getElementById('tourbar');
function showTour(){const s=G.tour[ti];if(!s)return;const names=s.nodeIds.map(id=>nodeById[id]).filter(Boolean);
 tb.innerHTML=`<button id="tp">◀</button><div class="tt"><b>${s.order}/${G.tour.length} · ${s.title}</b><p>${s.description}</p></div><button id="tn">${ti>=G.tour.length-1?'Finish ✓':'▶'}</button>`;
 document.getElementById('tp').onclick=()=>{if(ti>0){ti--;showTour();}};
 document.getElementById('tn').onclick=()=>{if(ti<G.tour.length-1){ti++;showTour();}else{tb.style.display='none';ti=-1;document.getElementById('toggleTour').textContent='▶ Guided tour';}};
 if(names[0]){select(names[0]);const n=names[0];svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity.scale(1.4).translate(-n.x,-n.y));}
}
document.getElementById('toggleTour').onclick=()=>{if(tb.style.display==='none'){ti=0;tb.style.display='flex';showTour();document.getElementById('toggleTour').textContent='✕ Close tour';}else{tb.style.display='none';ti=-1;document.getElementById('toggleTour').textContent='▶ Guided tour';}};
</script></body></html>
