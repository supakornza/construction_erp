{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Add Revision – Construction ERP{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4">
    <a href="{% url 'documents:detail' document.pk %}" class="btn btn-sm btn-outline-secondary me-3"><i class="fas fa-arrow-left"></i></a>
    <h4 class="mb-0">Add Revision to {{ document.document_no }}</h4>
</div>
<div class="card" style="max-width:600px;"><div class="card-body">{% crispy form %}</div></div>
{% endblock %}
