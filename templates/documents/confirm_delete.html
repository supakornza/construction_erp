{% extends "base.html" %}
{% block title %}Delete Document – Construction ERP{% endblock %}
{% block content %}
<div class="card border-danger" style="max-width:400px;margin-top:2rem;"><div class="card-body">
    <p>Delete document <strong>{{ object.document_no }}</strong>?</p>
    <form method="post">{% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'documents:list' %}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div></div>
{% endblock %}
