{% extends "base.html" %}
{% block title %}Confirm Delete{% endblock %}
{% block content %}
<div class="card mx-auto mt-5" style="max-width:480px">
  <div class="card-body text-center p-4">
    <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
    <h5>Delete this record?</h5>
    <p class="text-muted">{{ object }}</p>
    <form method="post" class="d-flex gap-2 justify-content-center mt-4">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
      <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
