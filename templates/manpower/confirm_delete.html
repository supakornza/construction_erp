{% extends "base.html" %}
{% block title %}Delete Manpower Record{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4">
    <a href="{% url 'manpower:list' %}" class="btn btn-sm btn-outline-secondary me-3"><i class="fas fa-arrow-left"></i></a>
    <h4 class="mb-0">Delete Manpower Record</h4>
</div>
<div class="card border-danger" style="max-width:400px;"><div class="card-body">
    <p>Delete this manpower record for <strong>{{ object.category }}</strong> on {{ object.report_date }}?</p>
    <form method="post">{% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'manpower:list' %}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div></div>
{% endblock %}
