{% extends "base.html" %}
{% block title %}Delete Delivery – Construction ERP{% endblock %}
{% block content %}
<div class="card border-danger" style="max-width:400px;margin-top:2rem;"><div class="card-body">
    <p>Delete delivery of <strong>{{ object.quantity|floatformat:3|intcomma }} {{ object.material.unit }}</strong> on {{ object.delivery_date|thai_be_date }}?</p>
    <form method="post">{% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'materials:delivery_list' %}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div></div>
{% endblock %}
