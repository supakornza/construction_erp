{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Material Delivery Form – Construction ERP{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4">
    <a href="{% url 'materials:delivery_list' %}" class="btn btn-sm btn-outline-secondary me-3"><i class="fas fa-arrow-left"></i></a>
    <h4 class="mb-0">{% if form.instance.pk %}Edit{% else %}Record{% endif %} Material Delivery</h4>
</div>
<div class="card"><div class="card-body">{% crispy form %}</div></div>
{% endblock %}
