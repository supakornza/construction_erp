{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Material Delivery Form – Construction ERP{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4">
    <a href="{% url 'materials:delivery_list' %}" class="btn btn-sm btn-outline-secondary me-3"><i class="fas fa-arrow-left"></i></a>
    <h4 class="mb-0">{% if form.instance.pk %}Edit{% else %}Record{% endif %} Material Delivery</h4>
</div>
<div class="card"><div class="card-body">{% crispy form %}</div></div>
{% endblock %}

{% block extra_scripts %}
<script>
const workAreas = {{ form.work_areas_json|safe }};

function filterDestination() {
  const projectSelect = document.getElementById('id_project');
  const destSelect = document.getElementById('id_destination');
  if (!projectSelect || !destSelect) return;
  const selectedProject = parseInt(projectSelect.value) || null;
  const currentValue = destSelect.value;

  // Remove all options except the empty one
  while (destSelect.options.length > 1) destSelect.remove(1);

  const filtered = selectedProject
    ? workAreas.filter(wa => wa.project_id === selectedProject)
    : workAreas;

  filtered.forEach(wa => {
    const opt = document.createElement('option');
    opt.value = wa.id;
    opt.textContent = wa.name;
    if (String(wa.id) === currentValue) opt.selected = true;
    destSelect.appendChild(opt);
  });
}

document.addEventListener('DOMContentLoaded', function () {
  filterDestination();
  const projectSelect = document.getElementById('id_project');
  if (projectSelect) projectSelect.addEventListener('change', filterDestination);
});
</script>
{% endblock %}
