<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน – Construction ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --primary:#1565C0; --bg:#f0f2f5; --border:#d0d5dd; --text:#1a2234; --muted:#6b7280; }
        body { background:var(--bg); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'Inter',system-ui,sans-serif; padding:1.5rem; }
        .auth-logo-icon { width:64px;height:64px;background:var(--primary);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:#fff;margin:0 auto 1rem;box-shadow:0 4px 14px rgba(21,101,192,.3); }
        .auth-card { background:#fff;border:1px solid var(--border);border-radius:14px;padding:2rem;width:100%;max-width:420px;box-shadow:0 2px 12px rgba(0,0,0,.07); }
        .field-wrap { border:1.5px solid var(--border);border-radius:9px;display:flex;align-items:center;background:#f9fafb;overflow:hidden;transition:border-color .15s; }
        .field-wrap:focus-within { border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(21,101,192,.1); }
        .field-icon { width:42px;display:flex;align-items:center;justify-content:center;color:#9ca3af; }
        .field-input { flex:1;border:none;background:transparent;padding:.65rem .5rem .65rem 0;font-size:.93rem;color:var(--text);outline:none; }
        .field-input::placeholder { color:#b0b8c4; }
        .btn-primary-custom { width:100%;padding:.72rem;background:var(--primary);color:#fff;border:none;border-radius:9px;font-size:.95rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.5rem;transition:background .15s; }
        .btn-primary-custom:hover { background:#1255a8; }
        .auth-footer { margin-top:1.25rem;text-align:center;font-size:.75rem;color:#9ca3af; }
    </style>
</head>
<body>
<div style="text-align:center;margin-bottom:1.5rem">
    <div class="auth-logo-icon"><i class="fas fa-unlock-alt"></i></div>
    <div style="font-size:1.5rem;font-weight:800;color:var(--text);letter-spacing:-.4px">ลืมรหัสผ่าน?</div>
    <div style="font-size:.85rem;color:var(--muted);margin-top:.25rem">กรอก Email ที่ใช้ลงทะเบียนเพื่อรับลิงก์รีเซ็ตรหัสผ่าน</div>
</div>

<div class="auth-card">
    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom:1.1rem">
            <label style="font-size:.82rem;font-weight:600;color:var(--text);display:block;margin-bottom:.4rem">Email Address</label>
            <div class="field-wrap">
                <span class="field-icon"><i class="fas fa-envelope" style="font-size:.9rem"></i></span>
                <input type="email" name="email" class="field-input" placeholder="your@email.com" autofocus required autocomplete="email">
            </div>
        </div>
        <button type="submit" class="btn-primary-custom">
            <i class="fas fa-paper-plane"></i>ส่งลิงก์รีเซ็ตรหัสผ่าน
        </button>
    </form>
    <div style="text-align:center;margin-top:1.2rem;font-size:.83rem;color:var(--muted)">
        <a href="{% url 'accounts:login' %}" style="color:var(--primary);text-decoration:none;font-weight:500">
            <i class="fas fa-arrow-left me-1"></i>กลับไปหน้าเข้าสู่ระบบ
        </a>
    </div>
</div>

<div class="auth-footer">
    <i class="fas fa-shield-alt" style="color:#4ade80"></i> Secure Field Environment &nbsp;·&nbsp; Construction ERP
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
