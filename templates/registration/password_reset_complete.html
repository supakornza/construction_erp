<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เปลี่ยนรหัสผ่านสำเร็จ – Construction ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --primary:#1565C0; --bg:#f0f2f5; --border:#d0d5dd; --text:#1a2234; --muted:#6b7280; }
        body { background:var(--bg); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'Inter',system-ui,sans-serif; padding:1.5rem; }
        .auth-card { background:#fff;border:1px solid var(--border);border-radius:14px;padding:2.5rem 2rem;width:100%;max-width:420px;box-shadow:0 2px 12px rgba(0,0,0,.07);text-align:center; }
        .icon-circle { width:72px;height:72px;background:#ecfdf5;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;font-size:1.9rem;color:#16a34a; }
        .btn-login { display:inline-flex;align-items:center;gap:.5rem;padding:.7rem 2rem;background:var(--primary);color:#fff;border-radius:9px;text-decoration:none;font-weight:600;font-size:.95rem;transition:background .15s; }
        .btn-login:hover { background:#1255a8;color:#fff; }
        .auth-footer { margin-top:1.25rem;text-align:center;font-size:.75rem;color:#9ca3af; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="icon-circle"><i class="fas fa-check"></i></div>
    <h5 style="font-weight:800;color:var(--text);margin-bottom:.6rem">เปลี่ยนรหัสผ่านสำเร็จ!</h5>
    <p style="color:var(--muted);font-size:.88rem;margin-bottom:1.75rem">
        รหัสผ่านของคุณได้รับการอัพเดตเรียบร้อยแล้ว<br>
        คุณสามารถเข้าสู่ระบบด้วยรหัสผ่านใหม่ได้ทันที
    </p>
    <a href="{% url 'accounts:login' %}" class="btn-login">
        <i class="fas fa-sign-in-alt"></i>เข้าสู่ระบบ
    </a>
</div>
<div class="auth-footer">
    <i class="fas fa-shield-alt" style="color:#4ade80"></i> Secure Field Environment &nbsp;·&nbsp; Construction ERP
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
