{% extends "base.html" %}
{% block title %}Delete Project – Construction ERP{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4">
    <a href="{% url 'projects:detail' object.pk %}" class="btn btn-sm btn-outline-secondary me-3"><i class="fas fa-arrow-left"></i></a>
    <h4 class="mb-0">Delete Project</h4>
</div>
<div class="card border-danger" style="max-width:500px;">
    <div class="card-body">
        <div class="alert alert-danger">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <strong>Warning:</strong> This will permanently delete <strong>{{ object.project_name }}</strong> and all associated data.
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
                <a href="{% url 'projects:detail' object.pk %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
