{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}BOQ Item Form – Construction ERP{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4">
    <a href="{% url 'boq:list' %}" class="btn btn-sm btn-outline-secondary me-3"><i class="fas fa-arrow-left"></i></a>
    <h4 class="mb-0">{% if form.instance.pk %}Edit{% else %}Add{% endif %} BOQ Item</h4>
</div>
<div class="card" style="max-width:700px;"><div class="card-body">{% crispy form %}</div></div>
{% endblock %}

{% block extra_scripts %}
<script>
(function () {
  var typeField = document.getElementById('id_item_type');
  var qtyRow = document.getElementById('qty-row');
  if (!typeField || !qtyRow) return;
  function toggle() {
    qtyRow.style.display = (typeField.value === 'header') ? 'none' : '';
  }
  typeField.addEventListener('change', toggle);
  toggle();
})();
</script>
{% endblock %}
