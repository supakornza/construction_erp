{% if messages %}
<div class="messages-container mb-4" role="alert" aria-live="polite">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
        {% if message.tags == 'success' %}<i class="fas fa-check-circle me-2 flex-shrink-0"></i>
        {% elif message.tags == 'danger' or message.tags == 'error' %}<i class="fas fa-exclamation-circle me-2 flex-shrink-0"></i>
        {% elif message.tags == 'warning' %}<i class="fas fa-exclamation-triangle me-2 flex-shrink-0"></i>
        {% else %}<i class="fas fa-info-circle me-2 flex-shrink-0"></i>{% endif %}
        <span>{{ message }}</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
</div>
{% endif %}
